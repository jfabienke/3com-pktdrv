# Build the DOS packet driver (NASM + Open Watcom wlink/wmake) and publish the binaries.
#   every push / PR: upload build/3cpd.exe, 3cpdpnp.exe, blast.com, sendlen.com as the "3cpd-binaries" artifact
#   a pushed v* tag: also attach them to that GitHub release
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # attach assets to the release on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NASM 3.01, the version the binaries are tested with: 2.x emits the operand-size and REP prefixes
      # of `rep movsd`/`rep outsd` in the other order (F3 66 vs 66 F3) -- equivalent, but not byte-identical
      - name: Install NASM 3.01
        uses: ilammy/setup-nasm@v1
        with:
          version: "3.01"

      - name: Install Open Watcom 2.0
        uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"

      # 3cpdpnp.exe = the pnp profile (-dCFG_PNP): adds ISA Plug and Play isolation, which a 3C515 in PnP
      # mode needs on a board with no PnP BIOS (it stays inactive until isolated). Built first, then the
      # default 3cpd.exe.
      - name: Build
        run: |
          nasm -v
          wmake -h DEFS=-dCFG_PNP
          mv build/3cpd.exe build/3cpdpnp.exe
          mv build/3cpd.map build/3cpdpnp.map
          rm -f build/start.obj
          wmake -h
          ls -l build/3cpd.exe build/3cpdpnp.exe build/blast.com build/sendlen.com build/3cdiag.com
          (cd build && sha256sum 3cpd.exe 3cpdpnp.exe blast.com sendlen.com 3cdiag.com) | tee build/SHA256SUMS

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: 3cpd-binaries
          path: |
            build/3cpd.exe
            build/3cpdpnp.exe
            build/3cpdpnp.map
            build/blast.com
            build/sendlen.com
            build/3cdiag.com
            build/3cpd.map
            build/SHA256SUMS

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/3cpd.exe
            build/3cpdpnp.exe
            build/blast.com
            build/sendlen.com
            build/3cdiag.com
            build/SHA256SUMS

  # ISA PnP diagnostics (GPL-2.0 isapnptools, real-mode DOS build via tools/isapnptools-dos)
  isapnptools-dos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: retroprom/isapnptools
          ref: b818477dc5a9343f13321f0303e7928a22172f9d
          path: isapnptools
      - name: Install Open Watcom 2.0
        uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"
      - name: Build pnpdump.exe + isapnp.exe
        run: bash tools/isapnptools-dos/build.sh isapnptools dist
      - uses: actions/upload-artifact@v4
        with:
          name: isapnptools-dos
          path: dist/
